[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p3ft"
version = "0.1.0"
description = "QLoRA fine-tuning vs prompt-engineering baselines on Banking77, tracked with MLflow and gated by CI/CD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "mlflow>=2.14",
]

[project.optional-dependencies]
# GPU training / evaluation stack
train = [
  "torch>=2.2",
  "transformers>=4.46,<5",
  "peft>=0.13",
  "accelerate>=0.34",
  "bitsandbytes>=0.43",
  "datasets>=2.20",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`
