name: CD

# Tag a release (git tag v0.1.0 && git push --tags): re-checks the gate, builds the serving
# image, pushes it to GitHub Container Registry, and publishes a GitHub Release with the report.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Quality gate (release blocked on failure)
        run: python -m p3ft.quality_gate --config configs/default.yaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - uses: softprops/action-gh-release@v2
        with:
          body_path: results/REPORT.md
          files: results/comparison.png
