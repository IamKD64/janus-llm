name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only; no torch needed for tests)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q --cov=p3ft --cov-report=term-missing

  quality-gate:
    # Blocks PRs whose committed results/*.json do not show the fine-tune beating the best
    # prompt baseline. Skips cleanly until you have committed real results.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Gate
        run: |
          if ls results/finetuned-*.json >/dev/null 2>&1; then
            python -m p3ft.quality_gate --config configs/default.yaml
          else
            echo "No committed results yet - skipping gate."
          fi
